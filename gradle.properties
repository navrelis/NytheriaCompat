# Changed by the Nytheria Compat project between 2026-09-29 and 2026-11-02; see docs/CHANGES.md.
# Based on Kilt by KiltMC (https://github.com/KiltMC/Kilt). Licensed under the GNU LGPL 2.1.

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# Task outputs are shared by all worktrees (Gradle's local build cache in the user home).
org.gradle.caching=true
# Loom skips downloading and remapping the sources of mod dependencies: about half of a fresh worktree's first build.
systemProp.fabric.loom.ci=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
# Minimum Fabric Loader written into fabric.mod.json "depends". Deliberately kept below 0.19.4:
# Fabric Loader >= 0.19.4 switches on strict mixin handling (required mixin configs fail hard on missing targets),
# which breaks the optional-mod compat mixins. Raise only after making those mixins @Pseudo/@IfModLoaded.
loader_min_version=0.19.3

# Mod Properties
# Version format: <mod_version>+mc<minecraft_version> (plus -local.<shortsha> unless -Pbuild.release=true)
mod_version=1.0.0
# Upstream release this fork started from (documentation only, not part of the version; see README credits and docs/CHANGES.md)
upstream_base_version=21.1.13
maven_group=dev.nytheria.compat
archives_base_name=NytheriaCompat

# https://ldtteam.jfrog.io/ui/native/parchmentmc-public/org/parchmentmc/data/
parchment_version=1.21.1
parchment_release=2024.11.17

